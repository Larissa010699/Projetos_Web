<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
    <link rel="stylesheet" href="style.css">
    <script src="script_calc.js" defer></script>
</head>
<body>
    <h1>Calculadora de Desconto</h1>
    <form>
        Produto: <input type="text" id="produto"><br><br>
        Valor: <input type="text" id="valor"><br><br>
        Desconto: <input type="number" step="5" id="desconto"><br><br>
        <input type="submit" value="Calcule" onclick="calcular()">
        <input type="reset" value="Limpar">
    </form>
    <div>
        <h3>Resultado</h3><br>
        <p id="resultado1"> </p>
        <p id="resultado2"> </p>
        <p id="resultado3"> </p>
        <p id="resultado4"> </p>
    </div>
</body>
</html>
